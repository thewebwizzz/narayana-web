<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Gulzar Nights</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>


    <main class="admin-login-page">


        <div class="login-box">


            <p class="admin-small-title">

                GULZAR NIGHTS

            </p>


            <h1>

                Admin Login

            </h1>


            <form id="loginForm">


                <input

                    type="text"

                    id="username"

                    placeholder="Username"

                    required>


                <input

                    type="password"

                    id="password"

                    placeholder="Password"

                    required>


                <button type="submit">

                    LOGIN

                </button>


            </form>


            <p id="loginMessage">

            </p>


        </div>


    </main>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        loginForm.addEventListener(

            "submit",

            async function (event) {

                event.preventDefault();


                const response =
                    await fetch(

                        "/api/admin/login",

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:

                                        document
                                            .getElementById(
                                                "username"
                                            )
                                            .value,

                                    password:

                                        document
                                            .getElementById(
                                                "password"
                                            )
                                            .value

                                })

                        }

                    );


                const result =
                    await response.json();


                if (
                    response.ok
                ) {

                    window.location.href =
                        "admin.html";

                }

                else {

                    document
                        .getElementById(
                            "loginMessage"
                        )
                        .textContent =

                        result.message;

                }

            }

        );

    </script>


</body>

</html>
