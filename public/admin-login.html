
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Gulzar Nights</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>


    <main class="admin-login-page">


        <div class="login-box">


            <p class="admin-small-title">
                GULZAR NIGHTS
            </p>


            <h1>
                Admin Login
            </h1>


            <form id="loginForm">


                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="loginButton"
                >
                    LOGIN
                </button>


            </form>


            <p id="loginMessage"></p>


        </div>


    </main>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();


                const password =
                    passwordInput.value;


                if (
                    !username ||
                    !password
                ) {

                    loginMessage.textContent =
                        "Enter username and password.";

                    return;
                }


                loginButton.disabled =
                    true;


                loginMessage.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "/api/admin/login",
                            {
                                method: "POST",

                                credentials:
                                    "same-origin",

                                cache:
                                    "no-store",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "ADMIN LOGIN:",
                        result
                    );


                    if (
                        !response.ok ||
                        result.success !== true
                    ) {

                        loginMessage.textContent =
                            result.message ||
                            "Incorrect username or password.";

                        loginButton.disabled =
                            false;

                        return;
                    }


                    /*
                     * Login succeeded.
                     * Go to the dashboard.
                     */

                    window.location.href =
                        "admin.html";


                } catch (error) {

                    console.error(
                        "Admin login error:",
                        error
                    );


                    loginMessage.textContent =
                        "Unable to connect to server.";


                    loginButton.disabled =
                        false;
                }

            }
        );

    </script>


</body>

</html>
